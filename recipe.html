<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe - Geeky Grands</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/recipe-page.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Cabin:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body data-content-type="recipe">
    <nav class="navigation">
        <div class="nav-container">
            <h1 class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 0.5rem;">
                    <img src="images/gglogo.jpg" alt="Geeky Grands Logo" class="logo-image">
                    Geeky Grands <span class="heart">♥</span>
                </a>
            </h1>
            <ul class="nav-menu">
                <li><a href="index.html#kitchen" class="nav-link">🍳 Back to Kitchen</a></li>
                <li><a href="index.html" class="nav-link">🏠 Home</a></li>
            </ul>
        </div>
    </nav>

    <section class="recipe-hero">
        <div class="recipe-hero-container">
            <div id="recipe-header" class="recipe-header">
                <h1 class="recipe-title">Loading recipe...</h1>
            </div>
        </div>
    </section>

    <main class="recipe-main">
        <div id="recipe-root" class="recipe-container">
            <div class="template-status">Pulling recipe from JSON...</div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-content" id="recipe-footer-content">
                <h4>Happy Baking!</h4>
                <p>Loading footer...</p>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Geeky Grands. Made with ♥ and a shared template.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="content-loader.js"></script>
</body>
</html>
