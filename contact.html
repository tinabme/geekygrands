<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Geeky Grands with a question or inquiry.">
    <title>Contact - Geeky Grands</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/websites-ai.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Cabin:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wallpaper-overlay" aria-hidden="true"></div>

    <nav class="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <h1 class="logo">
                <a href="index.html" class="service-logo-link">
                    <img src="images/gglogo.jpg" alt="" class="logo-image">
                    Geeky&nbsp;Grands <span class="heart">♥</span>
                </a>
            </h1>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="websites-ai.html" class="nav-link">Websites &amp; AI</a></li>
            </ul>
        </div>
    </nav>

    <main class="service-page">
        <div class="service-layout">
            <section class="service-intro" aria-labelledby="contact-page-title">
                <p class="service-eyebrow">I'd love to hear from you</p>
                <h2 id="contact-page-title">Get in touch</h2>
                <p>Have a question about a website, AI training, or something else? Send me a note, dear, and I'll be in touch.</p>
            </section>

            <section class="contact-panel" aria-labelledby="contact-form-title">
                <h3 id="contact-form-title">Drop me a note</h3>
                <form name="contact" method="POST" data-netlify="true">
                    <input type="hidden" name="form-name" value="contact">
                    <label for="contact-name">Your name</label>
                    <input id="contact-name" name="Name" autocomplete="name" required>

                    <label for="contact-email">Your email</label>
                    <input id="contact-email" name="Email" type="email" autocomplete="email" required>

                    <label for="contact-message">Your message</label>
                    <textarea id="contact-message" name="Message" rows="5" required></textarea>

                    <button type="submit">Send message</button>
                </form>
                <p class="form-note">I'll get back to you as soon as I can.</p>
            </section>
        </div>
    </main>

    <footer class="footer service-footer">
        <div class="footer-container">
            <p>Geeky Grands <span aria-hidden="true">♥</span></p>
        </div>
    </footer>
</body>
</html>
